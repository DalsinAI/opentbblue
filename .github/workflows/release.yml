name: Release OpenTBBlue

# A tag v* builds OpenTBBlue's installers for Linux, Windows, macOS and
# AmigaOS 3.2 (68040) and publishes the release; a tag with a suffix
# (v0.1.0-rc1) is a pre-release. A pull request that touches the build or
# the packages runs the same builds, without publishing, and keeps what they
# made as the run's artifacts.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['src/**', 'Makefile', 'package/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to make on this commit, such as v0.1.0 (empty builds only)'
        required: false

permissions:
  contents: write

env:
  # the tag without its v, or a test version for pull requests
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || 'v0.1.0-test' }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - run: make && make test
      - name: Package (.deb, and a plain .tar.gz)
        run: |
          v=${VERSION#v}
          dv=$(echo "$v" | sed 's/-/~/')   # 0.1.0~rc1 sorts before 0.1.0
          mkdir -p dist
          # .deb: Debian, Ubuntu, Mint, Raspberry Pi OS (x86-64)
          d=pkg/opentbblue_${v}_amd64
          install -Dm755 opentbblue "$d/usr/bin/opentbblue"
          strip "$d/usr/bin/opentbblue"
          install -Dm644 package/linux/opentbblue.desktop "$d/usr/share/applications/opentbblue.desktop"
          install -Dm644 package/icons/opentbblue.png "$d/usr/share/icons/hicolor/512x512/apps/opentbblue.png"
          install -Dm644 README.md "$d/usr/share/doc/opentbblue/README.md"
          install -Dm644 LICENSE "$d/usr/share/doc/opentbblue/copyright"
          mkdir -p "$d/DEBIAN"
          cat > "$d/DEBIAN/control" <<EOF
          Package: opentbblue
          Version: $dv
          Section: games
          Priority: optional
          Architecture: amd64
          Depends: libsdl2-2.0-0, curl, libc6
          Installed-Size: $(du -sk "$d/usr" | cut -f1)
          Maintainer: AmigaChrome Team <121399723+SacredTrees@users.noreply.github.com>
          Homepage: https://github.com/DalsinAI/opentbblue
          Description: ZX Spectrum Next (TBBlue) emulator in one window
           The first start downloads the latest official System/Next
           distribution and boots NextZXOS, with nothing to set up.
          EOF
          dpkg-deb --root-owner-group --build "$d" "dist/OpenTBBlue-$v-linux-x86_64.deb"
          dpkg-deb --info "dist/OpenTBBlue-$v-linux-x86_64.deb"
          # .tar.gz: any other distribution
          t=opentbblue-$v-linux-x86_64
          mkdir -p "$t"
          cp opentbblue README.md LICENSE package/linux/opentbblue.desktop package/icons/opentbblue.png "$t/"
          strip "$t/opentbblue"
          tar czf "dist/OpenTBBlue-$v-linux-x86_64.tar.gz" "$t"
      - name: The .deb installs and the program starts
        run: |
          sudo apt-get install -y ./dist/OpenTBBlue-*.deb
          opentbblue --version
          desktop-file-validate /usr/share/applications/opentbblue.desktop || true
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make zip mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-pkgconf mingw-w64-x86_64-binutils
      - name: Build, with the icon in the .exe
        run: |
          (cd package/windows && windres opentbblue.rc -O coff -o ../../opentbblue-icon.o)
          make LDLIBS="-static-libgcc opentbblue-icon.o"
      - run: make test
      - name: The program folder
        run: |
          d=opentbblue-windows-x86_64
          mkdir -p $d dist
          cp opentbblue.exe README.md LICENSE $d/
          ldd opentbblue.exe | awk '/mingw64/ {print $3}' | xargs -r -I{} cp -n {} $d/
          strip $d/*.exe
          zip -r "dist/OpenTBBlue-${VERSION#v}-windows-x86_64.zip" $d
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = "$env:VERSION".TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVERSION=$v" "/DSRC=$pwd\opentbblue-windows-x86_64" package\windows\opentbblue.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - name: The installer installs silently and the program is there
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OpenTBBlue\opentbblue.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse $env:LOCALAPPDATA\Programs | Select-Object -First 20; exit 1 }
          Write-Output "installed: $exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2
      - run: make CC=clang && make test CC=clang
      - name: OpenTBBlue.app in a .dmg
        run: |
          v=${VERSION#v}
          app=pkg/OpenTBBlue.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp opentbblue "$app/Contents/MacOS/"
          lib=$(otool -L opentbblue | awk '/libSDL2/ {print $1}')
          cp "$lib" "$app/Contents/MacOS/"
          install_name_tool -change "$lib" "@executable_path/$(basename "$lib")" "$app/Contents/MacOS/opentbblue"
          sed "s/@VERSION@/$v/g" package/macos/Info.plist > "$app/Contents/Info.plist"
          # the icon, at every size macOS asks for
          set=pkg/OpenTBBlue.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s package/icons/opentbblue.png --out "$set/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d package/icons/opentbblue.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/OpenTBBlue.icns"
          cp README.md LICENSE "$app/Contents/Resources/"
          codesign --force --deep -s - "$app"
          otool -L "$app/Contents/MacOS/opentbblue"
          # the disk image: the app, and a link to Applications to drag it to
          root=pkg/dmg
          mkdir -p "$root"
          cp -R "$app" "$root/"
          ln -s /Applications "$root/Applications"
          cp README.md "$root/"
          hdiutil create -volname "OpenTBBlue $v" -srcfolder "$root" -ov -format UDZO "dist/OpenTBBlue-$v-macos-arm64.dmg"
      - name: The app starts from the disk image
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/otb-dmg
          /tmp/otb-dmg/OpenTBBlue.app/Contents/MacOS/opentbblue --version
          hdiutil detach /tmp/otb-dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  amiga:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jlha-utils patch
      - name: Build with the Team's toolchain, and pack the .lha with its Installer
        run: sh package/amiga/build-ci.sh "${VERSION#v}" dist
      - uses: actions/upload-artifact@v4
        with: { name: amiga, path: dist/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: [linux, windows, macos, amiga]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          pre=; case $TAG in *-*) pre=--prerelease ;; esac   # v0.1.0-rc1 is a release candidate
          gh release create "$TAG" dist/* $pre --target "$GITHUB_SHA" --title "OpenTBBlue ${TAG#v}" --notes-file RELEASE-NOTES.md
